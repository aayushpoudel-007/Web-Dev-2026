<!DOCTYPE html>
<html>

<head>
	<title>Form</title>
</head>

<body>
	<form>
		<label for="name">Namessss:</label>
							
		<input 
			type="text"															
			id="name"									
			name="name"									
			placeholder="Enter your full name"
		>		 							

		<button type="submit">Submit</button>								
	</form>


	<form>
		<label for="email">Email</label>

		<input 
			type="email"
			id="email"
			name="email"
			placeholder="enter your email"
		>
		
		<button type="submit">Submit</button>
	</form>

	<form>
		<label for="password">Password</label>

		<input
		type="password"
		id="password"
		name="password"
		placeholder="enter your password"
		>

		<button type="submit">Submit</button>
	</form>

	<form>
		<label for="requirednumber">RequiredNumber</label>

		<input
		type="requirednumber"
		id="requirednumber"
		name="requirednumber"
		placeholder="Enter a Required Number"
		required
		>

		<button type="submit">Submit</button>
	</form>

</body>

</html>

<!-- input type="text" - to enter normal text
     input type="email" - to enter email (also used for validation)
     input type="password" - to enter passwords (hides the entered data)
     input type="number" - to enter numerical input
     input type="url" - to enter URL/website
     input type="date" - to enter date
     input type="radio" - to select one option from a group
     input type="checkbox" - to select zero or more options
     input type="file" - to choose/upload a file
     input type="submit" - to submit the form
