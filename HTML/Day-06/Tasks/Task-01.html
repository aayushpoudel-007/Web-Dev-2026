<!-- Create a table for a small store's inventory

Requirements

Your table should contain:

Caption: Store Inventory

Header

Create these columns:

Category
Product Name
Price
Quantity

Design the table like this
| Category | Product Name | Price | Quantity |
| -------- | ------------ | ----: | -------: |
| Snacks   | Chips        |    50 |       10 |
| Snacks   | Biscuits     |    40 |       15 |
| Drinks   | Coke         |    50 |       20 |
| Drinks   | Pepsi        |    50 |       12 |

Footer

Add a total row:

Total Products          57

Don't just copy the category into every row. Instead, use rowspan 

-->


<!DOCTYPE html>
<html>

<head>
	<title>Store Inventory</title>
</head>

<body>
	<table>
		<caption>Store Inventory</caption>

	<thead>
		<tr>
			<th>Category</th>
			<th>Product Name</th>
			<th>Price</th>
			<th>Quantity</th>
		</tr>
	</thead>

	<tbody>

		<tr>
			<td rowspan="2">Snacks</td>
			<td>Chips</td>
			<td>50</td>
			<td>10</td>
		</tr>

		<tr>
			<td>Biscuits</td>
			<td>40</td>
			<td>15</td>
		</tr>

		<tr>
			<td rowspan="2">Drinks</td>
			<td>Coke</td>
			<td>50</td>
			<td>20</td>
		</tr>

		<tr>
			<td>Pepsi</td>
			<td>50</td>
			<td>12</td>
		</tr>
	</tbody>

	<tfoot>
		<tr>
			<td colspan="3">Total:</td>
			<td>57</td>
		</tr>
	</tfoot>

	</table>

</body>

</html>
