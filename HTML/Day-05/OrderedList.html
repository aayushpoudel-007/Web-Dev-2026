<!DOCTYPE html>
<html>

<head>
	<title>Ordered List</title>
</head>

<body>
	<ol>
		<li>HTML</li>								<!-- Ordered List is used when the order of the items is important -->							
		<li>CSS</li>								<!-- such as rankings, or instructions which are denoted by numbers (1,2,3..) by default -->
		<li>JS</li>
	</ol>

	<ol type="A">				<!-- ol type="A" denotes the items in the list by uppercase alphabets (A,B,C..) -->
		<li>HTML</li>
		<li>CSS</li>
		<li>JS</li>	
	</ol>

	<ol type="a">				<!-- ol type="a" denotes the items in the list by lowercase alphabets (a,b,c..) -->
		<li>HTML</li>
		<li>CSS</li>
		<li>JS</li>
	</ol>

	<ol type="I">				<!-- ol type"I" denotes the items in the list by uppercase Roman numericals (I, II, III..) -->
		<li>HTML</li>
		<li>CSS</li>
		<li>JS</li>
	</ol>

	<ol type="i">				<!-- ol type="i" denotes the items in the list by lowercase Roman numericals (i,ii,iii..) -->
		<li>HTML</li>
		<li>HTML</li>
		<li>JS</li>
	</ol>

</body>

</html>
