<!DOCTYPE html>
<html>

<head>
	<title>Nested List</title>
</head>

<body>
	<ol>
		<li>Frontend
				<ul>				<!-- Nested Unordered List inside the Ordered List 'Frontend' -->
					<li>HTML</li>
					<li>CSS</li>
					<li>JS</li>
				</ul>
		</li>
	</ol>

	<ul>
		<li>Frontend
				<ol>
					<li>HTML</li>		<!-- Nested Ordered List inside the Unordered List 'Frontend' -->
					<li>CSS</li>
					<li>JS</li>
				</ol>
		</li>
	</ul>
</body>

</html>
		
<!-- the closing tag of the parent list - 'Frontend' in this case - has to be behind the nested list because it has to wrap the nested list inside. -->
