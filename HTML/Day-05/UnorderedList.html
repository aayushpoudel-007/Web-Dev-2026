<!DOCTYPE html>
<html>

<head>
	<title>Unordered List</title>
</head>

<body>
	<ul>
		<li>HTML</li>												
		<li>CSS</li>
		<li>JS</li>
	</ul>

	<ul>
		<li>Karthika</li>
		<li>Loves</li>
		<li>Aayush</li>
	</ul>

</body>

</html>

<!-- Unordered List is used when the order of the items is not important, such as shopping lists. The items are denoted by bullet points by default and can be changed by CSS. Unordered list does not have type attribute like Ordered List -->
