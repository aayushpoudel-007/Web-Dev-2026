<!DOCTYPE html>
<html>

<head>

<title>Relative IMG tag</title>

</head>

<body>

<img src="images/daredevil.png" alt="daredevil">			<!-- <img> (image) tag tells the browser to display an image.																			src means source, it tells the browser, where the location of the image is inside ="".
</body>									alt means alternative text, it tells the browser the text to display if the image is not available. -->

</html>

<!-- <img src="images/daredevil.png" alt="daredevil"> is a relative path, which means that it gives the location of the image relative to the html document, in this case - the image is in a folder named
images in the parent folder.
Advantages:
- Portable - website can be moved to another computer without changing the path.
- Works naturally when you upload the web project to a web server.
- Short and clean.
- Better project organization.
- Doesn't expose computer's folder structure.

Disadvantages:
- You need to understand .\ and ..\ paths.
- Workability depends upon the HTML document's location, moving might cause the image to not be shown.
- Large projects have complicated paths. -->
