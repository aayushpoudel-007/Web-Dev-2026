<!DOCTYPE html>
<html>

<head>

	<title>Absolute IMG tag</title>

</head>

<body>

	<img src="C:\Users\aayus\Desktop\Web-Dev-2026\Day-04\images\daredevil.png" alt="daredevil">

</body>

</html>

<!-- <img src="C:\Users\aayus\Desktop\Web-Dev-2026\Day-04\images\daredevil.png" alt="daredevil"> is an absolute path, which means that it gives the full path of the image or the full location of the image
in the computer, in this case - the image is in inside C drive, in a folder named "Web-Dev-2026" in the desktop of the user.
Advantages:
- Clearly specifies the exact location of the file.
- Independent of the HTML file's location.
- Useful for external assets.
- Easy to see where the asset is located.

Disadvantages:
- Not portable, will only work on one computer in the specified path.
- Moving or renaming files can break the path.
- Long and messy.
- Exposes critical information like the computer's username or file structure.
