<!DOCTYPE html>
<html>

<head>
	<title>Anchor Tag</title>
</head>

<body>

	<a href="https://www.google.com">Google</a>						
											
</body>											
											
</html>



<!-- <a> is the anchor tag: used to create hyperlinks
href is the attribute of the <a> tag, which tells the browser where the hyperlink should redirect
"https://www.google.com" is the value of the href attribute - basically the URL where the hyperlink redirects	
Anything after the closing tag, in this case, "Google" is the Anchor Element - the text which redirects to the URL after clicking -->
